{% extends "base.html" %}

{% block title %} Create activity {% endblock %}

{% block navbar %}
    {% include "activities/nav.html" %}
{% endblock %}

{% block header %}
<h1>Create an activity</h1>
{% endblock %}

{% block content %}
<form method="POST">
<table>
	<tr>
		<td><label for="Title">Activity Title:</label></td>
		<td><input name="Title" id="Title" type="text"></td>
	</tr>

	<tr>
		<td><label for="Date">Date:</label></td>
		<td><input name="Date" id="Date" type="date"></td>
	</tr>

	<tr>
		<td><label for="StartTime">Start Time:</label></td>
		<td><input name="StartTime" id="StartTime" type="time"></td>
	</tr>

	<tr>
		<td><label for="EndTime">End Time:</label></td>
		<td><input name="EndTime" id="EndTime" type="time"></td>
	</tr>

	<tr>
		<td><label for="Description">Activity Description:</label></td>
		<td><input name="Description" id="Description" type="text"></td>
	</tr>

	<tr>
		<td></td>
		<td><input type="submit" value="Create"></td>
	</tr>
</table>
</form>

{% endblock %}
