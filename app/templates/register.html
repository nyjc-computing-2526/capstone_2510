{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block head %}
{% endblock %} 


{% block header %}
<h1>Register?</h1>
{% endblock %}

{% block content %}
<h2>Register an account!</h2>
<p>
    <form method="POST">
        Email: <input name="email" type="text"> <br />
        Name: <input name="name" type="text"> <br />
        Password: <input name="password" type="password"> <br />
        Re-enter password: <input name="password_again" type="password">
        <button type="submit">Register!</button>
    </form> <br />

    {% if msg %}
        <p id="msg">
            {{msg}}
        </p>
    {% endif %}
</p>
{% endblock %}
